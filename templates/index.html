<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>
    <form method="GET" action="{{ url_for('add') }}"
                        style="display: inline;">

        <button type="submit">Add New Post</button>
    </form><br></br>
    <!-- <a href="{{ url_for('add') }}">Add New Post</a> -->
    {% for post in posts %}
        <div class="post">
            <h2>Post Title: {{ post.title }}</h2>
            <p><em>Written by {{ post.author }}</em></p>
            <p>Post content: {{ post.content }}</p>

            <!-- Update button -->
            <div style="display: flex; gap: 8px;">
                <a href="{{ url_for('update_post', post_id=post.id) }}">
                    <button type="button">Update</button>
                </a>

                <!-- Delete button -->
                <form method="POST"
                    action="{{ url_for('delete_post', post_id=post.id) }}"
                    style="display: inline;">

                    <button type="submit">Delete</button>
                </form>
                <form method="POST"
                    action="{{ url_for('like_post', post_id=post.id) }}"
                    style="display: inline;">

                    <button type="submit">
                        <img src="{{ url_for('static', filename='images/like.png') }}"
                            alt=""
                            width="18"
                            height="14">
                        <span class="like-count">{{ post.likes }}</span>
                    </button>
                </form>
            </div>



        </div>
    {% endfor %}

</body>
</html>
